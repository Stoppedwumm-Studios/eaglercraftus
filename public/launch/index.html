<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <h1>Loading…</h1>
</body>

<script type="module">
document.addEventListener("DOMContentLoaded", async () => {

    /* ===========================================================
       1. Fetch remote HTML
    ============================================================ */

    const url = "https://stoppedwummpython.github.io/eageag/eaglercraft_wasm_client/";
    let remoteHtml = "";

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        remoteHtml = await res.text();
    } catch (err) {
        document.body.innerHTML = `<h1>Error loading page: ${err.message}</h1>`;
        return;
    }

    /* ===========================================================
       2. Firebase SDK tags
    ============================================================ */

    const firebaseSdkScripts = `
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"><\/script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"><\/script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"><\/script>
    `;

    /* ===========================================================
       3. Synchronization script (safe module)
    ============================================================ */

    const syncScript = `
        import * as fflate from "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js";

        const MAX_CHUNK_SIZE = 1024 * 1024;

        const firebaseConfig = {
            apiKey: "AIzaSyCJkNBHsYzOuymw2vP_HdvKuNdUsRIb4t4",
            authDomain: "in-space-wm.firebaseapp.com",
            projectId: "in-space-wm",
            storageBucket: "in-space-wm.firebasestorage.app",
            messagingSenderId: "38093154042",
            appId: "1:38093154042:web:44c7c33d159efd11704b43",
            measurementId: "G-WXSMK0TP1S"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db   = firebase.firestore();

        /* ========== IndexedDB Dump ========== */
        async function dumpIndexedDB() {
            const out = {};
            const list = await indexedDB.databases();
            for (const meta of list) {
                const name = meta.name;
                const openReq = indexedDB.open(name);
                await new Promise(res => openReq.onsuccess = res);
                const dbi = openReq.result;
                const tx = dbi.transaction(dbi.objectStoreNames, "readonly");
                const stores = {};
                for (const s of dbi.objectStoreNames) {
                    const store = tx.objectStore(s);
                    stores[s] = await new Promise(r => {
                        const req = store.getAll();
                        req.onsuccess = () => r(req.result);
                    });
                }
                out[name] = stores;
            }
            return out;
        }

        /* ========== IndexedDB Restore ========== */
        async function restoreIndexedDB(data) {
            for (const dbName in data) {
                const meta = data[dbName];
                const openReq = indexedDB.open(dbName);
                openReq.onupgradeneeded = e => {
                    const dbi = e.target.result;
                    for (const storeName in meta) {
                        if (!dbi.objectStoreNames.contains(storeName)) {
                            dbi.createObjectStore(storeName, { autoIncrement: true });
                        }
                    }
                };
                await new Promise(res => openReq.onsuccess = res);
                const dbi = openReq.result;
                const tx = dbi.transaction(dbi.objectStoreNames, "readwrite");
                for (const storeName in meta) {
                    const store = tx.objectStore(storeName);
                    for (const item of meta[storeName]) store.add(item);
                }
            }
        }

        /* ========== Compression helpers ========== */
        function compressChunks(obj) {
            const bytes = fflate.strToU8(JSON.stringify(obj));
            const gz = fflate.gzipSync(bytes);
            const out = [];
            let i = 0;
            while (i < gz.length) {
                out.push(btoa(String.fromCharCode(...gz.slice(i, i + MAX_CHUNK_SIZE))));
                i += MAX_CHUNK_SIZE;
            }
            return out;
        }

        function decompressChunks(chunks) {
            if (!chunks) return {};
            let bin = "";
            for (const c of chunks) bin += atob(c);
            const u8 = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            return JSON.parse(fflate.strFromU8(fflate.gunzipSync(u8)));
        }

        /* ========== Auth + Sync ========== */
        auth.onAuthStateChanged(async user => {
            if (!user) return;
            const userDoc = db.collection("users").doc(user.uid);
            const snapshot = await userDoc.get();

            if (snapshot.exists) {
                const data = snapshot.data();
                if (data.localStorageChunks) {
                    Object.assign(localStorage, decompressChunks(data.localStorageChunks));
                }
                if (data.indexedDBChunks) {
                    await restoreIndexedDB(decompressChunks(data.indexedDBChunks));
                }
            }

            while (true) {
                await new Promise(r => setTimeout(r, 5000));
                await userDoc.set({
                    localStorageChunks: compressChunks({ ...localStorage }),
                    indexedDBChunks: compressChunks(await dumpIndexedDB())
                }, { merge: true });
            }
        });
    `;
    
    /* ===========================================================
       4. Safely inject scripts INTO the HTML STRING
    ============================================================ */
    
    const syncModuleScript = `<script type="module">${syncScript}<\/script>`;

    remoteHtml = remoteHtml.replace(
        "</head>",
        firebaseSdkScripts + syncModuleScript + "</head>"
    );
    
    /* ===========================================================
       4.5. Fix the 'window.load' event listener issue
    ============================================================ */

    remoteHtml = remoteHtml.replace(
      'window.addEventListener("load", function() {',
      'const eaglerMain = function() {'
    );
    remoteHtml = remoteHtml.replace(
      '});',
      '}; if (document.readyState === "complete") { eaglerMain(); } else { window.addEventListener("load", eaglerMain); }'
    );

    /* ===========================================================
       5. Replace document and re-execute scripts sequentially
    ============================================================ */

    const doc = new DOMParser().parseFromString(remoteHtml, "text/html");
    
    document.replaceChild(
        document.importNode(doc.documentElement, true),
        document.documentElement
    );

    const runScript = (oldScript) => {
        return new Promise((resolve, reject) => {
            const newScript = document.createElement("script");
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            
            newScript.onload = resolve;
            newScript.onerror = reject;
            
            oldScript.parentNode.replaceChild(newScript, oldScript);
            
            if (!newScript.src) resolve();
        });
    };
    
    const scriptsToRun = Array.from(document.querySelectorAll("script"));

    for (const script of scriptsToRun) {
        try {
            await runScript(script);
        } catch (error) {
            console.error("Error executing script:", error);
            break;
        }
    }
});
</script>
</html>
