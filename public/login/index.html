<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css" />
</head>
<body>

    <h1>Welcome! Please sign in.</h1>
    <div id="firebaseui-auth-container"></div>
    <p id="loading-message">Loading...</p>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.js"></script>
    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCJkNBHsYzOuymw2vP_HdvKuNdUsRIb4t4",
            authDomain: "in-space-wm.firebaseapp.com",
            projectId: "in-space-wm",
            storageBucket: "in-space-wm.firebasestorage.app",
            messagingSenderId: "38093154042",
            appId: "1:38093154042:web:44c7c33d159efd11704b43",
            measurementId: "G-WXSMK0TP1S"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const ui = new firebaseui.auth.AuthUI(auth);

        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is already signed in or has just signed in.
                console.log("User is signed in, redirecting to dashboard...");
                window.location.href = 'dashboard.html'; 
            } else {
                // User is signed out. Show the login UI.
                console.log("No user found, showing login UI.");
                document.getElementById('loading-message').style.display = 'none';

                ui.start('#firebaseui-auth-container', {
                    signInOptions: [
                        firebase.auth.EmailAuthProvider.PROVIDER_ID,
                        firebase.auth.GoogleAuthProvider.PROVIDER_ID
                    ],
                    callbacks: {
                        signInSuccessWithAuthResult: () => false // Prevent redirect
                    },
                    signInFlow: 'popup'
                });
            }
        });
    </script>

</body>
</html>
